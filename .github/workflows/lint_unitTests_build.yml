name: Lint + UnitTests + Build

on:
  push:
    branches:
      - develop
      - mission/*
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: true

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/develop' && !startsWith(github.ref, 'refs/heads/mission/') }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools'

      - name: Get changed Kotlin files
        id: get_changed_files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
            set -euo pipefail
            if [ -z "$BASE_SHA" ] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
              echo "Base commit '$BASE_SHA' unavailable; falling back to ${HEAD_SHA}^"
              BASE_SHA=$(git rev-parse "${HEAD_SHA}^")
            fi
            echo "Diff range: $BASE_SHA..$HEAD_SHA"
            CHANGED_FILES=$(git diff --name-only --diff-filter=d "$BASE_SHA" "$HEAD_SHA" | { grep -E '\.kt$|\.kts$' || true; })
            echo "Changed Kotlin files:"
            echo "$CHANGED_FILES"
            DELIM="EOF_$(openssl rand -hex 8)"
            {
              echo "CHANGED_FILES<<$DELIM"
              echo "$CHANGED_FILES"
              echo "$DELIM"
            } >> "$GITHUB_OUTPUT"

      - name: Run ktlintCheck on changed files
        if: steps.get_changed_files.outputs.CHANGED_FILES != ''
        env:
          CHANGED_FILES: ${{ steps.get_changed_files.outputs.CHANGED_FILES }}
        run: ./gradlew ktlintCheck -PinternalKtlintGitFilter="$CHANGED_FILES"

      - name: lint check
        run: ./gradlew --no-daemon lintDebug

      - name: detekt check
        run: ./gradlew --no-daemon detektDebug

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/develop' && !startsWith(github.ref, 'refs/heads/mission/') }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools'

      - name: unit tests with coverage
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest :koverHtmlReportCoverage

      - name: test report
        uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6.6.1
        if: ${{ always() }}
        with:
          report_paths: '**/build/test-results/testDebugUnitTest/TEST-*.xml'
          fail_on_failure: true
          detailed_summary: true
          annotate_only: true

      - name: upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.ref == 'refs/heads/develop'
        with:
          name: coverage-site
          path: build/reports/kover/htmlCoverage
          retention-days: 1

  api-reference:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools'

      - name: build the API reference
        run: ./gradlew --no-daemon :dokkaGenerate

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-reference
          path: build/dokka/html
          retention-days: 1

  pages:
    runs-on: ubuntu-latest
    needs: [unit, api-reference]
    if: ${{ !cancelled() && github.ref == 'refs/heads/develop' && needs.unit.result == 'success' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: download coverage report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-site
          path: site/coverage

      - name: download API reference
        if: needs.api-reference.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: api-reference
          path: api-reference

      - name: cache API reference
        if: needs.api-reference.result == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: api-reference
          key: api-reference-${{ github.sha }}

      - name: restore the last API reference
        if: needs.api-reference.result != 'success'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: api-reference
          key: api-reference-${{ github.sha }}
          restore-keys: api-reference-

      - name: assemble site
        run: |
          cp .github/pages/index.html site/
          [ -d api-reference ] || { echo "::error::No API reference to deploy; the published site stays as it is"; exit 1; }
          mv api-reference site/api

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  build:
    runs-on: ubuntu-latest 
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/develop' && !startsWith(github.ref, 'refs/heads/mission/') }}

      - name: build project
        run: ./gradlew --no-daemon assembleDebug
