name: Lint + UnitTests + Build

on:
  push:
    branches:
      - develop
      - mission/*
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
          submodules: true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Get changed Kotlin files
        id: get_changed_files
        run: |
            CHANGED_FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -E '\.kt$|\.kts$' || true)
            echo "Changed Kotlin files:"
            echo "$CHANGED_FILES"
            DELIM="EOF_$(openssl rand -hex 8)"
            {
              echo "CHANGED_FILES<<$DELIM"
              echo "$CHANGED_FILES"
              echo "$DELIM"
            } >> "$GITHUB_OUTPUT"

      - name: Run ktlintCheck on changed files
        if: steps.get_changed_files.outputs.CHANGED_FILES != ''
        env:
          CHANGED_FILES: ${{ steps.get_changed_files.outputs.CHANGED_FILES }}
        run: ./gradlew ktlintCheck -PinternalKtlintGitFilter="$CHANGED_FILES"

      - name: lint check
        run: ./gradlew --no-daemon lintDebug

      - name: detekt check
        run: ./gradlew --no-daemon detektDebug

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: unit tests with coverage
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest koverHtmlReport

      - name: test report
        uses: mikepenz/action-junit-report@3a81627bfac62268172037048872e8ebd4207e6d # v6.4.1
        if: ${{ always() }}
        with:
          report_paths: '**/build/test-results/testDebugUnitTest/TEST-*.xml'
          fail_on_failure: true
          detailed_summary: true
          annotate_only: true

      - name: upload coverage report
        uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/develop'
        with:
          path: build/reports/kover/html

  deploy-coverage:
    runs-on: ubuntu-latest
    needs: unit
    if: github.ref == 'refs/heads/develop'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5

  build:
    runs-on: ubuntu-latest 
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: build project
        run: ./gradlew --no-daemon assembleDebug
