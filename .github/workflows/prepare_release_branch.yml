name: Prepare release branch

on:
  push:
    branches:
      - 'release/*.*.*'
      - 'support/*.*.*'

permissions:
  contents: read

jobs:
  extract_version:
    if: github.event.created
    name: Extract Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
    steps:
      - name: Extract version from branch name
        id: extract
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          BRANCH_NAME="$REF_NAME"
          echo "BRANCH_NAME: $BRANCH_NAME"
          VERSION="${BRANCH_NAME#release/}"
          VERSION="${VERSION#support/}"
          echo "VERSION: $VERSION"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          
  bump_version:
    name: Bump Version
    runs-on: ubuntu-latest
    needs: extract_version
    permissions:
      contents: write
    outputs:
      version2: ${{ steps.bump.outputs.version2 }}
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive
      
      - name: Configure Git identity for GitHub Action Bot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      
      - name: Bump version
        env:
          VERSION: ${{ needs.extract_version.outputs.version }}
        run: ./.github/bump_versions_in_release_branch.sh "$VERSION"

      - name: Output version
        id: bump
        env:
          VERSION: ${{ needs.extract_version.outputs.version }}
        run: |
          echo "version2=$VERSION" >> "$GITHUB_OUTPUT"
          
  check_sdk_version:
    name: Check SDK Version
    runs-on: ubuntu-latest
    needs: bump_version
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Pull latest changes
        run: git pull

      - name: Check if SDK_VERSION_NAME matches VERSION
        env:
          VERSION2: ${{ needs.bump_version.outputs.version2 }}
        run: |
          SDK_VERSION=$(grep '^SDK_VERSION_NAME=' gradle.properties | cut -d '=' -f2)
          EXPECTED_VERSION="$VERSION2"

          if [ "$SDK_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "SDK_VERSION_NAME ($SDK_VERSION) does not match the expected version ($EXPECTED_VERSION)."
            exit 1
          fi
        shell: bash

  create_pull_request:
    name: Create Pull Request
    runs-on: ubuntu-latest
    needs: check_sdk_version
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive
    
      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.PAT_FOR_TRIGGERING_BRANCH_PROTECTION }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          gh pr create \
            --base master \
            --head "$REF_NAME" \
            --title "$REF_NAME" \
            --body "Updates the release version to $REF_NAME"
          PR_URL=$(gh pr view --json url --jq '.url')
          echo "PR_URL=$PR_URL" >> "$GITHUB_ENV"
 
