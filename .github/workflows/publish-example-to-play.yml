name: Publish Example to Google Play

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to release the example app from'
        required: true
        default: 'develop'

permissions:
  contents: read

concurrency:
  group: publish-example-to-play
  cancel-in-progress: false

jobs:
  bump_version:
    name: Bump example version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version_code: ${{ steps.bump.outputs.version_code }}
      version_name: ${{ steps.bump.outputs.version_name }}
      release_branch: ${{ steps.bump.outputs.release_branch }}
    steps:
      - name: Checkout source branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: 0
          submodules: recursive

      - name: Configure Git identity for GitHub Action Bot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump versionCode and versionName
        id: bump
        run: ./.github/bump_example_versions.sh

  create_pr:
    name: Create Pull Request
    runs-on: ubuntu-latest
    needs: bump_version
    steps:
      - name: Checkout release branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.bump_version.outputs.release_branch }}

      - name: Create PR via GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.PAT_FOR_TRIGGERING_BRANCH_PROTECTION }}
          SRC: ${{ needs.bump_version.outputs.release_branch }}
          DST: ${{ github.event.inputs.branch }}
          VERSION_NAME: ${{ needs.bump_version.outputs.version_name }}
          VERSION_CODE: ${{ needs.bump_version.outputs.version_code }}
        run: |
          gh pr create \
            --base "$DST" \
            --head "$SRC" \
            --title "Example app release $VERSION_NAME (versionCode $VERSION_CODE)" \
            --body "Automated version bump for the example app Google Play release. Merged automatically after a successful upload to Google Play."

  build_and_upload:
    name: Build and upload to Google Play
    runs-on: ubuntu-latest
    needs: bump_version
    steps:
      - name: Checkout release branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.bump_version.outputs.release_branch }}
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Restore signing and config files from secrets
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.EXAMPLE_UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.EXAMPLE_KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.EXAMPLE_KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.EXAMPLE_KEYSTORE_KEY_PASSWORD }}
          GOOGLE_SERVICES_JSON: ${{ secrets.EXAMPLE_GOOGLE_SERVICES_JSON }}
          AGCONNECT_SERVICES_JSON: ${{ secrets.EXAMPLE_AGCONNECT_SERVICES_JSON }}
          EXAMPLE_PROPERTIES: ${{ secrets.EXAMPLE_PROPERTIES }}
        run: |
          set -euo pipefail
          printf '%s' "$UPLOAD_KEYSTORE_BASE64" | base64 -d > example/app/upload_key_gp.jks
          {
            echo "storeFile=upload_key_gp.jks"
            echo "storePassword=$KEYSTORE_STORE_PASSWORD"
            echo "keyAlias=$KEYSTORE_KEY_ALIAS"
            echo "keyPassword=$KEYSTORE_KEY_PASSWORD"
          } > example/keystore.properties
          printf '%s' "$GOOGLE_SERVICES_JSON" > example/app/google-services.json
          printf '%s' "$AGCONNECT_SERVICES_JSON" > example/app/agconnect-services.json
          printf '%s' "$EXAMPLE_PROPERTIES" > example/example.properties

      - name: Build release bundle
        working-directory: example
        run: ./gradlew --no-daemon bundleRelease

      - name: Attach AAB to workflow run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: example-release-bundle
          path: example/app/build/outputs/bundle/release/app-release.aab

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.mindbox.example
          releaseFiles: example/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: draft
          releaseName: ${{ needs.bump_version.outputs.version_name }} (${{ needs.bump_version.outputs.version_code }})

  merge_pr:
    name: Merge version bump PR
    runs-on: ubuntu-latest
    needs: [bump_version, create_pr, build_and_upload]
    steps:
      - name: Checkout release branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.bump_version.outputs.release_branch }}

      - name: Merge PR via GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.PAT_FOR_TRIGGERING_BRANCH_PROTECTION }}
          RELEASE_BRANCH: ${{ needs.bump_version.outputs.release_branch }}
        run: |
          pr_number=$(gh pr list --head "$RELEASE_BRANCH" --json number --jq '.[0].number // empty')
          if [ -z "$pr_number" ]; then
            echo "No open PR found for branch $RELEASE_BRANCH"
            exit 1
          fi
          gh pr merge "$pr_number" --merge --auto --delete-branch
