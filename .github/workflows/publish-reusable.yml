name: SDK publish

on:
  workflow_call:
    inputs:
      branch:
        required: true
        type: string
    secrets:
      GPGKEYCONTENTS:
        required: true
      SECRETPASSPHRASE:
        required: true
      SIGNINGPASSWORD:
        required: true
      SIGNINGKEYID:
        required: true
      CENTER_PORTAL_USERNAME:
        required: true
      CENTER_PORTAL_PASSWORD:
        required: true
      PAT_FOR_TRIGGERING_BRANCH_PROTECTION:
        required: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.branch }}
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - name: lint check
        run: ./gradlew --no-daemon lintDebug

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.branch }}
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - name: unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

  build:
    needs: [lint, unit-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.branch }}
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      - name: build project
        run: ./gradlew --no-daemon assembleDebug

  set-tag:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.branch }}
          submodules: recursive
      - name: Extract SDK version
        run: |
            SDK_VERSION=$(grep '^SDK_VERSION_NAME=' gradle.properties | cut -d '=' -f2)
            echo "SDK_VERSION=$SDK_VERSION" >> "$GITHUB_ENV"
            echo "Extracted SDK version: $SDK_VERSION"
      - name: Create tag
        run: |
            if git rev-parse -q --verify "refs/tags/$SDK_VERSION" >/dev/null; then
              echo "Local tag $SDK_VERSION already exists."
            else
              git tag "$SDK_VERSION"
            fi
            if [ -n "$(git ls-remote --tags origin "refs/tags/$SDK_VERSION")" ]; then
              echo "Remote tag $SDK_VERSION already exists."
            else
              git push origin "$SDK_VERSION"
            fi

  publish:
    needs: [set-tag]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.branch }}
          submodules: recursive
      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      - name: Prepare to publish
        env:
          GPGKEYCONTENTS: ${{ secrets.GPGKEYCONTENTS }}
          SECRETPASSPHRASE: ${{ secrets.SECRETPASSPHRASE }}
          SIGNINGPASSWORD: ${{ secrets.SIGNINGPASSWORD }}
          SIGNINGKEYID: ${{ secrets.SIGNINGKEYID }}
          CENTER_PORTAL_USERNAME: ${{ secrets.CENTER_PORTAL_USERNAME }}
          CENTER_PORTAL_PASSWORD: ${{ secrets.CENTER_PORTAL_PASSWORD }}
        run: |
          echo "$GPGKEYCONTENTS" | base64 -d > /tmp/publish_key.gpg
          gpg --quiet --batch --yes --decrypt --passphrase="$SECRETPASSPHRASE" \
          --output /tmp/secret.gpg /tmp/publish_key.gpg
          {
            echo ""
            echo "signing.password=$SIGNINGPASSWORD"
            echo "signing.keyId=$SIGNINGKEYID"
            echo "signing.secretKeyRingFile=/tmp/secret.gpg"
            echo "mavenCentralUsername=$CENTER_PORTAL_USERNAME"
            echo "mavenCentralPassword=$CENTER_PORTAL_PASSWORD"
          } >> gradle.properties
      - name: Publish to Central Portal
        # Change github variable CENTER_PORTAL_AUTO_RELEASE to set up auto release Maven Central
        env:
          CENTER_PORTAL_AUTO_RELEASE: ${{ vars.CENTER_PORTAL_AUTO_RELEASE }}
          SONATYPE_CONNECT_TIMEOUT_SECONDS: 60
          SONATYPE_CLOSE_TIMEOUT_SECONDS: 900
        run: |
          if [ "$CENTER_PORTAL_AUTO_RELEASE" = "true" ]; then
          ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache
          else
          ./gradlew publishToMavenCentral --no-configuration-cache
          fi

  release-github:
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.branch }}
      - name: GitHub Release generation
        run: ./.github/git-release-ci.sh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ inputs.branch }}

  merge:
    needs: [publish]
    if: |
      startsWith(github.head_ref, 'release') && 
      github.base_ref == 'master'
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.PAT_FOR_TRIGGERING_BRANCH_PROTECTION }}
    steps:
      - name: Checkout develop branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: develop
      - name: Create Pull Request
        run: gh pr create --base develop --head master --title "Merge 'master' into 'develop' after release" --body "Automated Pull Request to merge 'master' into 'develop' after release"
      - name: Merge Pull Request
        run: |
          pr_number=$(gh pr list --base develop --head master --json number --jq '.[0].number')
          gh pr merge "$pr_number" --merge --auto
